# Hammerspace CSI plugin manifest, validated on Kubernetes 1.36 (and works on
# 1.30+ in practice). It is the 1.29 manifest plus the observability wiring:
#   - a host-networked `metrics` port (9090 controller / 9091 node), and
#   - OTel env vars on both driver containers.
#
# Observability env (see deploy/monitoring/README.md and docs/observability.md):
#   OTEL_METRICS_EXPORTER=prometheus            metrics on; scrape :9090 / :9091
#   OTEL_METRICS_PROMETHEUS_LISTEN=:9090|:9091  per-container listen addr
#   OTEL_TRACES_EXPORTER=console                spans to pod stdout — VERBOSE;
#                                               set to "none" to disable in prod,
#                                               or "otlp" (+ OTEL_EXPORTER_OTLP_ENDPOINT)
#                                               to ship to a collector.
# Sidecar image tags (csi-provisioner / csi-attacher / csi-snapshotter /
# csi-resizer / node-driver-registrar) match the 1.29 manifest.
#### CSI Object
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: com.hammerspace.csi
spec:
  attachRequired: false
  podInfoOnMount: true
  requiresRepublish: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
  storageCapacity: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hammerspace-csi-frozen-targets
  namespace: {{ .Values.namespace }}
data: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hammerspace-csi-snapshot-state
  namespace: {{ .Values.namespace }}
data: {}

#### Controller Service
---
# needed for StatefulSet
kind: Service
apiVersion: v1
metadata:
  name: csi-provisioner
  namespace: {{ .Values.namespace }}
  labels:
    app: csi-provisioner
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  # This is needed for the StatefulSet to work properly
  # as it uses a headless service to manage the pods.
  # The StatefulSet will create a DNS entry for the pods
  # in the format <pod-name>.<service-name>.<namespace>.svc.cluster.local
  # where <pod-name> is the name of the pod, <service-name> is the name of the service,
  # and <namespace> is the namespace of the service.
  # This allows the pods to communicate with each other using DNS.
  # The StatefulSet will also create a DNS entry for the service in the format <service-name>.<namespace>.svc.cluster.local
  # which allows the pods to communicate with the service
  selector:
    app: csi-provisioner
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-provisioner
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: csi-provisioner
  serviceName: "csi-provisioner"
  replicas: {{ .Values.controller.replicas }}
  template:
    metadata:
      labels:
        app: csi-provisioner
    spec:
      serviceAccountName: csi-provisioner
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: csi-provisioner
              topologyKey: kubernetes.io/hostname
      containers:
        - name: csi-provisioner
          imagePullPolicy: {{ .Values.sidecars.pullPolicy }}
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.1.1@sha256:d992c36d4ddd6dfa37c81b487e5a673920e1360e2977eb779051df8da1c5787d
          args:
            - "--csi-address=$(CSI_ENDPOINT)"
            - "--timeout=60s"  # Recommended as shares may take some time to create
            - "--leader-election=true"
            - "--v=5"
          env:
            - name: CSI_ENDPOINT
              value: /var/lib/csi/hs-csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/
        - name: csi-snapshotter
          imagePullPolicy: {{ .Values.sidecars.pullPolicy }}
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0@sha256:da081c27e8a6d91f36042c1942362d0515ced8d06e18c11b8f893e58c4d6d797
          args:
            - "--csi-address=$(CSI_ENDPOINT)"
            - "--leader-election=true"
            - "--v=5"
          env:
            - name: CSI_ENDPOINT
              value: /var/lib/csi/hs-csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/
        - name: csi-resizer
          imagePullPolicy: {{ .Values.sidecars.pullPolicy }}
          image: registry.k8s.io/sig-storage/csi-resizer:v2.1.0@sha256:589e525cddef6d768e68da1f0bc9ffd0a24bf3add3dd010648eb7189976fde79
          args:
            - "--csi-address=$(CSI_ENDPOINT)"
            - "--leader-election=true"
            - "--v=5"
          env:
            - name: CSI_ENDPOINT
              value: /var/lib/csi/hs-csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/
        - name: hs-csi-plugin-controller
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          image: {{ include "hammerspace-csi.image" . | quote }}
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
          envFrom:
            - configMapRef:
                name: csi-env-config
          env:
            - name: CSI_ENDPOINT
              value: /var/lib/csi/hs-csi.sock
            - name: HS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: username
            - name: HS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: password
            - name: HS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: endpoint
            - name: HS_TLS_VERIFY
              value: {{ .Values.tls.verify | quote }}
            {{- if .Values.tls.caBundleSecretName }}
            - name: HS_CA_BUNDLE
              value: /etc/hammerspace/tls/{{ .Values.tls.caBundleKey }}
            {{- end }}
            - name: CSI_MAJOR_VERSION
              value: "1"
            - name: CSI_LEADER_ELECTION
              value: {{ .Values.controller.leaderElection | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Log verbosity: panic, fatal, error, warn, info, debug, trace.
            # debug logs every Anvil REST call — use it for troubleshooting,
            # not steady-state operation.
            - name: LOG_LEVEL
              value: "info"
            # OTel toggles — Prometheus /metrics on :9090 (on by default). Set
            # OTEL_TRACES_EXPORTER=console/otlp to also emit spans (off by default).
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "prometheus"
            - name: OTEL_METRICS_PROMETHEUS_LISTEN
              value: ":9090"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/
            - name: staging-dir
              mountPath: /var/lib/hammerspace/csi-staging
              mountPropagation: Bidirectional
            {{- if .Values.tls.caBundleSecretName }}
            - name: hammerspace-ca
              mountPath: /etc/hammerspace/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: staging-dir
          hostPath:
            path: /var/lib/hammerspace/csi-staging
            type: DirectoryOrCreate
        {{- if .Values.tls.caBundleSecretName }}
        - name: hammerspace-ca
          secret:
            secretName: {{ .Values.tls.caBundleSecretName }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: csi-provisioner
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: csi-provisioner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-provisioner
  namespace: {{ .Values.namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-provisioner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # pods/exec: needed by the driver's Freezer to run `fsfreeze --freeze`
  # inside the app pod holding a source volume during CreateSnapshot. Without
  # this the driver falls back to snapshotting without quiescing, which for
  # XFS can produce an inconsistent-log snapshot that log-recovery empties on
  # restore. See pkg/driver/freezer.go.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["hammerspace-csi-frozen-targets", "hammerspace-csi-snapshot-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "patch", "list", "watch", "create", "delete", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumeclaims/status"]
    verbs: ["get", "patch", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["list", "watch", "create", "update", "delete", "get"]
  # Least-privilege: the driver's Anvil credentials are injected into the pods by
  # the kubelet via secretKeyRef, which needs no ServiceAccount RBAC. This grant is
  # scoped to only the named credential Secret (get, not cluster-wide list) so a
  # compromised provisioner ServiceAccount can't enumerate or read other Secrets.
  # If you set per-volume secrets on a StorageClass
  # (csi.storage.k8s.io/provisioner-secret-name), add those Secret name(s) here.
  # See deploy/kubernetes/SECRETS.md.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.credentials.existingSecret | quote }}]
    verbs: ["get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "list", "watch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "update"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-provisioner
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: csi-provisioner
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: csi-provisioner
  apiGroup: rbac.authorization.k8s.io
#### Node service
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-node
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: csi-node
  template:
    metadata:
      labels:
        app: csi-node
    spec:
      serviceAccount: csi-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: driver-registrar
          imagePullPolicy: {{ .Values.sidecars.pullPolicy }}
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0@sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", '[ -n "$REG_SOCKET" ] && rm -rf "$REG_SOCKET" || echo "REG_SOCKET not set, skipping delete"']
          args:
            - "--v=5"
            - "--csi-address=$(CSI_ENDPOINT)"
            - "--kubelet-registration-path=$(REG_SOCKET)"
          securityContext:
            privileged: true
          env:
            - name: CSI_ENDPOINT
              value: /csi/csi.sock
            - name: REG_SOCKET
              value: /var/lib/kubelet/plugins_registry/com.hammerspace.csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: hs-csi-plugin-node
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          image: {{ include "hammerspace-csi.image" . | quote }}
          ports:
            - containerPort: 9091
              name: metrics
              hostPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: csi-env-config
          env:
            - name: CSI_ENDPOINT
              value: /csi/csi.sock
            - name: HS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: username
            - name: HS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: password
            - name: HS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: endpoint
            - name: CSI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HS_TLS_VERIFY
              value: {{ .Values.tls.verify | quote }}
            {{- if .Values.tls.caBundleSecretName }}
            - name: HS_CA_BUNDLE
              value: /etc/hammerspace/tls/{{ .Values.tls.caBundleKey }}
            {{- end }}
            - name: CSI_MAJOR_VERSION
              value: "1"
            # Log verbosity: panic, fatal, error, warn, info, debug, trace.
            # debug logs every Anvil REST call — use it for troubleshooting,
            # not steady-state operation.
            - name: LOG_LEVEL
              value: "info"
            # OTel toggles. hostNetwork=true means we bind directly to the
            # node's :9091 (must differ from controller's :9090 in case the
            # controller lands on the same node).
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "prometheus"
            - name: OTEL_METRICS_PROMETHEUS_LISTEN
              value: ":9091"
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
              mountPropagation: Bidirectional
            - name: mountpoint-dir
              mountPath: /var/lib/kubelet/
              mountPropagation: Bidirectional
            - name: rootshare-dir
              mountPath: /var/lib/hammerspace/
              mountPropagation: Bidirectional
            - name: dev-dir
              mountPath: /dev
            - name: staging-dir
              mountPath: /var/lib/hammerspace/csi-staging
              mountPropagation: Bidirectional
            {{- if .Values.tls.caBundleSecretName }}
            - name: hammerspace-ca
              mountPath: /etc/hammerspace/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/com.hammerspace.csi
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet/
        - name: rootshare-dir
          hostPath:
            path: /var/lib/hammerspace/
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
        - name: dev-dir
          hostPath:
            path: /dev
        - name: staging-dir
          hostPath:
            path: /var/lib/hammerspace/csi-staging
            type: DirectoryOrCreate
        {{- if .Values.tls.caBundleSecretName }}
        - name: hammerspace-ca
          secret:
            secretName: {{ .Values.tls.caBundleSecretName }}
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-node
  namespace: {{ .Values.namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-node
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  # Least-privilege: the node driver's credentials are injected by the kubelet via
  # secretKeyRef (no ServiceAccount RBAC needed). Scoped to only the named
  # credential Secret (get, not cluster-wide list). See deploy/kubernetes/SECRETS.md.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.credentials.existingSecret | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "events"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "persistentvolumeclaims/status","events"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-node
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: csi-node
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: csi-node
  apiGroup: rbac.authorization.k8s.io

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-provisioner-snapshot-content-status
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents", "volumesnapshotcontents/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-provisioner-snapshot-content-status-binding
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: csi-provisioner
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: csi-provisioner-snapshot-content-status
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-env-config
  namespace: {{ .Values.namespace }}
# Example: "300ms". Valid time units are "ns", "us" (or "µs"), "ms", "s", "m", "h".
data:
  MOUNT_CHECK_TIMEOUT: "30s"
  UNMOUNT_RETRY_COUNT: "5"
  UNMOUNT_RETRY_INTERVAL: "1s"
{{- if .Values.observability.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hammerspace-csi-controller
  namespace: {{ .Values.namespace }}
  labels:
    app: csi-provisioner
spec:
  selector:
    matchLabels:
      app: csi-provisioner
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: metrics
      path: /metrics
{{- end }}
