apiVersion: v1
kind: Namespace
metadata:
  name: hammerspace-csi
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hammerspace-csi-operator
  namespace: hammerspace-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hammerspace-csi-operator
  template:
    metadata:
      labels:
        app: hammerspace-csi-operator
    spec:
      serviceAccountName: hammerspace-csi-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: hammerspace-csi-operator:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RELATED_IMAGE_DRIVER
          value: hammerspaceinc/csi-plugin:v1.3.0
        - name: RELATED_IMAGE_PROVISIONER
          value: registry.k8s.io/sig-storage/csi-provisioner:v3.6.0
        - name: RELATED_IMAGE_ATTACHER
          value: registry.k8s.io/sig-storage/csi-attacher:v4.4.0
        - name: RELATED_IMAGE_SNAPSHOTTER
          value: registry.k8s.io/sig-storage/csi-snapshotter:v6.2.1
        - name: RELATED_IMAGE_RESIZER
          value: registry.k8s.io/sig-storage/csi-resizer:v1.14.0
        - name: RELATED_IMAGE_REGISTRAR
          value: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
        - name: RELATED_IMAGE_LIVENESSPROBE
          value: registry.k8s.io/sig-storage/livenessprobe:v2.12.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
